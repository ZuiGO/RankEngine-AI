version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rankengine_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rankengine
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: rankengine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rankengine_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/rankengine
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LLM_API_KEY=${LLM_API_KEY}
      - SERP_API_KEY=${SERP_API_KEY}
      - SERP_API_PROVIDER=${SERP_API_PROVIDER}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: rankengine_worker
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rankengine
      - REDIS_URL=redis://redis:6379
      - LLM_API_KEY=${LLM_API_KEY}
      - PLAYWRIGHT_HEADLESS=true
      - SCALE_UP_THRESHOLD=10
      - SCALE_CHECK_INTERVAL=30
      - SERP_API_KEY=${SERP_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rankengine_web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
