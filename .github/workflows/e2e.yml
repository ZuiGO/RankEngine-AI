name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3000
  MONGODB_URI: mongodb://localhost:27017/rankengine_e2e
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-jwt-secret-at-least-8-chars!!
  JWT_EXPIRY: 1h
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  CORS_ORIGIN: http://localhost:5173
  SERP_API_PROVIDER: mock
  SERP_API_KEY: mock-serp-key
  LLM_API_KEY: mock-llm-key
  DATAFORSEO_LOGIN: ""
  DATAFORSEO_PASSWORD: ""
  STRIPE_SECRET_KEY: sk_test_mock
  STRIPE_WEBHOOK_SECRET: whsec_mock
  STORAGE_PATH: ./data/reports

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Build API (TypeScript)
        run: npm run build --workspace=apps/api
        env:
          NODE_ENV: test

      - name: Start API server
        run: |
          node dist/index.js > /tmp/api.log 2>&1 &
          API_PID=$!
          echo "API PID: $API_PID"
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/health 2>/dev/null | grep -q ok; then
              echo "API ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "API failed to start. Last log lines:"
              tail -20 /tmp/api.log
              exit 1
            fi
            sleep 1
          done
        working-directory: apps/api
        env:
          NODE_ENV: test
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/rankengine_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-jwt-secret-at-least-8-chars!!
          JWT_EXPIRY: 1h
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CORS_ORIGIN: http://localhost:5173
          SERP_API_PROVIDER: mock
          SERP_API_KEY: mock-serp-key
          LLM_API_KEY: mock-llm-key
          DATAFORSEO_LOGIN: ""
          DATAFORSEO_PASSWORD: ""
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock
          STORAGE_PATH: ./data/reports

      - name: Start Web dev server
        run: |
          npx vite --port 5173 > /tmp/web.log 2>&1 &
          WEB_PID=$!
          echo "Web PID: $WEB_PID"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:5173 2>/dev/null | grep -q 200; then
              echo "Web ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Web failed to start. Last log lines:"
              tail -20 /tmp/web.log
              exit 1
            fi
            sleep 1
          done
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: npx playwright test --reporter=html
        working-directory: apps/web

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: apps/web/test-results/
          retention-days: 7

      - name: Kill background servers
        if: always()
        run: |
          kill %1 %2 2>/dev/null || true
