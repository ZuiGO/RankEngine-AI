server {
    listen 80;
    server_name localhost;

    # Proxy /api/* to the Express API container over the Docker Compose internal
    # network. Without this block, relative /api/ requests from the browser land
    # here and fall through to the static `location /` handler, which only
    # permits GET/HEAD — so POST, PATCH, DELETE all get a raw nginx 405.
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support React Router client-side routing
        try_files $uri $uri/ /index.html;
    }

    # Custom error page for system errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

